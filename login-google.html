<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIDRATA+ - Login con Google</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4FC3F7, #29B6F6, #03A9F4);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .browser-bar {
            background: #f5f5f5;
            padding: 8px 15px;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #666;
        }

        .browser-controls {
            display: flex;
            gap: 5px;
        }

        .browser-controls span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .browser-controls span:nth-child(1) { background: #ff5f57; }
        .browser-controls span:nth-child(2) { background: #ffbd2e; }
        .browser-controls span:nth-child(3) { background: #28ca42; }

        .url-bar {
            background: white;
            padding: 4px 8px;
            border-radius: 15px;
            margin-left: 10px;
            font-size: 11px;
            color: #999;
            flex: 1;
        }

        .screen {
            background: linear-gradient(135deg, #4FC3F7, #29B6F6, #03A9F4);
            border-radius: 0 0 20px 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            min-height: 500px;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .back-arrow {
            color: #03A9F4;
            font-size: 24px;
            margin-bottom: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        .back-arrow:hover {
            opacity: 0.7;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #03A9F4;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .google-logo {
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #4285f4, #ea4335, #fbbc05, #34a853);
            border-radius: 3px;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 12px;
            text-transform: uppercase;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #03A9F4;
        }

        .primary-button {
            width: 100%;
            background: #03A9F4;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .primary-button:hover {
            background: #0288D1;
        }

        .link {
            color: #03A9F4;
            text-decoration: none;
            font-size: 14px;
        }

        .link:hover {
            text-decoration: underline;
        }

        .checkbox-group {
            margin-bottom: 20px;
        }

        .checkbox-group label {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            width: auto;
        }

        .droplet-bg {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 140px;
            background: rgba(255,255,255,0.1);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .droplet-text {
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        .droplet-subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .droplet-bg {
                display: none;
            }
            
            .container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="browser-bar">
            <div class="browser-controls">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="url-bar">www.hidrata-plus.com/login/google</div>
            <div style="margin-left: auto; color: #666;">Google</div>
        </div>
        
        <div class="screen">
            <div class="form-card">
                <a href="index.html" class="back-arrow">←</a>
                <div class="logo-section">
                    <div class="logo-icon">
                        <div class="google-logo"></div>
                    </div>
                    <div style="font-size: 12px; color: #666;">Iniciar Sesión con Google</div>
                </div>
                
                <div class="title">Inicia Sesión</div>
                
                <form id="googleLoginForm">
                    <div class="form-group">
                        <input type="email" id="email" placeholder="CONTRASEÑA/USUARIO" required>
                    </div>
                    
                    <div style="margin: 15px 0;">
                        <a href="#" class="link">¿Has olvidado tu correo electrónico?</a>
                    </div>
                    
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="remember">
                            PROCEDER AL CONTENIDO
                        </label>
                    </div>
                    
                    <button type="submit" class="primary-button">Siguiente</button>
                </form>
            </div>
            
            <div class="droplet-bg">
                <div>
                    <div class="droplet-text">HIDRATA+</div>
                    <div class="droplet-subtitle">Mantente hidratado</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('googleLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const remember = document.getElementById('remember').checked;
            
            if (email) {
                // Simular proceso de autenticación con Google
                alert('Redirigiendo a autenticación de Google...');
                // En una app real, aquí irían las APIs de Google OAuth
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
